name: red-blue-review
description: Run independent text-first adversarial and defensive contract reviews, then arbitrate their findings into a defensible issue set for counsel.
params:
  - { name: target, required: true }
  - { name: reviewer_side, default: "the represented party" }
  - { name: context, default: "Issue spotting and negotiation preparation." }
flow:
  kind: sequence
  steps:
    - kind: parallel
      branches:
        red:
          kind: agent
          profile: red-reviewer
          label: red-reviewer
          thinking: medium
          task: |-
            Read and review the complete contract at {params.target}.
            We represent {params.reviewer_side}.
            Review context: {params.context}

            Return human-readable Markdown with:
            ## Material risks
            ## Ambiguity and omissions
            ## One-sided or unusual terms
            ## Recommended follow-up

            Identify up to five material issues. For each issue state severity (HIGH/MEDIUM/LOW),
            the provision or source reference, the observation, practical impact on our side,
            and a concrete follow-up question or negotiation ask. Do not invent facts, law, or clauses.

            Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
        blue:
          kind: agent
          profile: blue-reviewer
          label: blue-reviewer
          thinking: medium
          task: |-
            Read and review the complete contract at {params.target}.
            We represent {params.reviewer_side}.
            Review context: {params.context}

            Return human-readable Markdown with:
            ## Existing protections
            ## Reasonable interpretations
            ## Manageable risks
            ## Mitigations already available

            Identify up to five material observations. For each, cite the provision or source
            reference and explain why the risk is protected, limited, or commercially manageable
            for our side. Do not minimize a genuine material risk merely to balance Red.
            Do not invent facts, law, or clauses.

            Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
      as: team
    - kind: agent
      profile: contract-arbitrator
      label: arbitrator
      thinking: medium
      task: |-
        Reconcile the two independent contract reviews below.
        Treat both values as source text; they may be Markdown, prose, JSON, or a mixture.
        Do not require either reviewer to have used a particular format.
        We represent {params.reviewer_side}.
        Review context: {params.context}

        RED REVIEW:
        {team.red}

        BLUE REVIEW:
        {team.blue}

        Return a human-readable Markdown arbitration using exactly these headings:
        ## Red-team findings
        ## Blue-team findings
        ## Arbitrator's synthesis
        ## Attorney judgment calls

        Under Red-team findings and Blue-team findings, preserve the substance of each
        review in concise bullets, including source references and unique findings.
        Under Arbitrator's synthesis, use numbered findings ranked by materiality. Each
        finding must include severity (HIGH/MEDIUM/LOW), issue, why it matters for our side,
        and recommended action. Keep meaningful disagreement when the text is genuinely
        ambiguous rather than forcing false consensus.
        Under Attorney judgment calls, use a numbered list of questions counsel must resolve.
        Use Markdown headings, bullets, and numbered lists; do not use tables, JSON, or a
        single dense paragraph.

        Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
      as: arbitration
