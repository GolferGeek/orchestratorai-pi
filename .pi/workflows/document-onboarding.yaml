name: document-onboarding
description: Classify, inventory, check completeness, and issue-spot a document before deeper legal review. Produces an attorney-ready intake report with a prioritized review checklist.
params:
  - { name: target, required: true, description: Path to the document to onboard }
  - { name: context, default: "Prepare this document for legal intake. Flag blockers, missing materials, and the recommended next workflow.", description: Intake goal }
  - { name: run_id, default: "", description: "OrchestratorAI run id (set by the app; leave empty from the TUI)" }
doc: |-
  Composition: parallel classification + completeness check → onboarding summary.
  No mid-flow gate; the attorney reviews the final intake report in the console.

  ```orchestrator-launch
  title: Document Onboarding
  icon: doc.badge.plus
  group: document-management
  file: { label: document, param: target }
  fields:
    - { param: context, label: Intake goal, kind: text }
  samples:
    - { title: Incomplete services draft, path: fixtures/onboarding/incomplete-services-agreement.md }
    - { title: Complete short lease, path: fixtures/onboarding/complete-short-lease.md }
    - { title: Routing memo, path: fixtures/onboarding/routing-memo.md }
    - { title: Conflicting NDA versions, path: fixtures/onboarding/conflicting-version-nda.md }
  review:
    focusTitle: Attorney intake focus
    focusSubtitle: Mark each intake blocker or question as you verify it. Decisions are recorded on the shared attorney-review checkpoint.
    blurb: Confirm intake findings, missing materials, and the recommended next workflow. Recording Approve or Request changes writes the attorney-review checkpoint for this run.
  ```
flow:
  kind: sequence
  steps:
    - kind: parallel
      branches:
        classification:
          kind: agent
          profile: document-classifier
          label: classifier
          task: |-
            Read the complete document at {params.target}.
            Intake context: {params.context}

            Produce a precise intake classification in Markdown covering:
            1) Likely document type and confidence (high/medium/low) with one-sentence rationale
            2) Apparent parties and roles (do not invent unnamed parties)
            3) Dates, term, version/revision clues, and governing-law / venue clues when present
            4) Referenced exhibits, schedules, addenda, SOWs, or related agreements (attached vs missing)
            5) Clause / topic inventory with short source references (heading or excerpt)
            6) Uncertainties and assumptions — label each as Assumption or Unknown

            Cite headings or short excerpts. Do not invent facts, law, or missing text.
            Do not write the final onboarding report; classification only.

            Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
        completeness:
          kind: agent
          profile: document-completeness-checker
          label: completeness-checker
          task: |-
            Read the complete document at {params.target}.
            Intake context: {params.context}

            Produce a completeness and preliminary-issue assessment in Markdown covering:
            1) Components present (signatures, definitions, commercial terms, exhibits, notices, governing law, etc.)
            2) Referenced but missing materials
            3) Structural blockers (unsigned draft cues, broken cross-refs, placeholder brackets, conflicting versions)
            4) Preliminary issues a lawyer should verify before deeper review — each with severity HIGH/MEDIUM/LOW and a source reference
            5) Readiness: Ready for deeper review / Needs materials / Route elsewhere — with one sentence why

            Separate confirmed observations from questions. Do not invent missing text.
            Do not write the final onboarding report; completeness only.

            Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
      as: intake
    - kind: agent
      profile: document-onboarding-summary-writer
      label: onboarding-summary
      task: |-
        Produce the final onboarding report for {params.target}.
        Intake context: {params.context}

        The first line of the report must be exactly:
        # Document onboarding — [short document name]
        Never call this report a contract review unless the source document itself is a contract
        and you are only recommending that a later contract-review workflow be run.

        CLASSIFICATION:
        {intake.classification}

        COMPLETENESS CHECK:
        {intake.completeness}

        Merge both perspectives into one attorney-ready intake package.
        Under ## Attorney review focus, list every standout intake issue as unchecked tasks:
        - [ ] SEVERITY — issue; question or recommended action
        Use SEVERITY in {HIGH, MEDIUM, LOW}. Prefer 3–7 items; lead with blockers.
        Under ## Recommended next workflow, name exactly one primary next step
        (e.g. contract-review, manual intake, privacy review, no further automated workflow)
        and one sentence of rationale. Preserve source references and distinguish facts,
        assumptions, and uncertainties.

        Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
display: report
