name: deposition-prep
description: Prepare for a deposition from witness details and case facts. Produces a preparation outline with themes, predicted questions, vulnerabilities and an exhibit plan - or switches to predicted-cross-exam mode for opposing counsel's likely attack lines with answer preparation that only ships if the witness-coaching guard passes it.
trigger: when the user asks to prepare for a deposition or to predict cross-examination of a witness
params:
  - { name: witness, required: true, description: "Witness name and type (corporate officer, expert, fact witness)" }
  - { name: case_facts, required: true, description: "Case facts and posture" }
  - { name: topics, default: "Not specified", description: "Deposition topics to cover" }
  - { name: mode, default: "Preparation outline", description: "Preparation outline | Predicted cross-exam" }
  - { name: knowledge_dir, default: "matters", description: "Folder searched for the matter record" }
  - { name: run_id, default: "", description: "OrchestratorAI run id (set by the app; leave empty from the TUI)" }
doc: |-
  Composition: case analyst -> switch(mode) { outline: questions -> research |
  cross-exam: opposing counsel -> predicted cross -> answer prep -> **Jev guard** -> switch(decision) } -> report.
  Ported from orchestratorai-local `legal/workflows/deposition-prep`. The answer-preparation step was
  removed once: three rounds of prompt rules could not stop a local model from scripting testimony.
  It is back behind a typed guard - `jev_check` runs the `witness-coaching` rubric (orchestratorai-jev)
  over the prep text and the workflow switches on the decision: pass -> included; review -> shown to the
  attorney at a gate before inclusion; block -> omitted and the report says why. The generative step is
  still an LLM; what changed is that a calibrated classifier, not a prompt, decides whether it ships.

  ```orchestrator-launch
  title: Deposition Prep
  icon: person.wave.2
  group: litigation
  file: { kind: none }
  fields:
    - { param: witness, label: Witness, kind: line, default: "Dana Ruiz - VP Engineering, Aspen Devices (corporate officer)" }
    - { param: case_facts, label: Case facts, kind: text, default: "Harbor Peak alleges Aspen used its data-pipeline architecture after an NDA evaluation. Aspen says its engineers relied only on residuals retained in memory. No documents were copied." }
    - { param: topics, label: Topics, kind: text, default: "NDA evaluation meetings; what engineers retained; the product timeline; the residuals clause." }
    - { param: mode, label: Mode, kind: choice, options: [Preparation outline, Predicted cross-exam] }
    - { param: knowledge_dir, label: Knowledge folder, kind: line }
  review:
    focusTitle: Attorney review focus
    focusSubtitle: Predicted questions are preparation aids. Verify every fact against the record before the deposition.
    blurb: Confirm the preparation plan before working with the witness. Recording Approve or Request changes completes the attorney-review checkpoint.
  ```
flow:
  kind: sequence
  steps:
    - kind: agent
      profile: depo-case-analyst
      label: case-analyst
      task: |-
        Map the strategic landscape for this deposition.
        Witness: {params.witness}
        Case facts: {params.case_facts}
        Deposition topics: {params.topics}
        Matter record to search with find/grep/read (may be empty): {params.knowledge_dir}

        Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
      as: landscape

    - kind: switch
      label: mode
      on: "{params.mode}"
      cases:
        - when: { eq: ["", "Predicted cross-exam"] }
          then:
            kind: sequence
            steps:
              - kind: agent
                profile: depo-opposing-counsel
                label: opposing-counsel
                task: |-
                  Find the attack lines against our witness.
                  Witness: {params.witness}
                  Case facts: {params.case_facts}

                  STRATEGIC LANDSCAPE:
                  {landscape}

                  Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
                as: attack
              - kind: agent
                profile: depo-cross-exam-generator
                label: cross-exam-generator
                task: |-
                  Generate the predicted cross-examination for this witness.
                  Witness: {params.witness}
                  Case facts: {params.case_facts}

                  ATTACK LINES:
                  {attack}

                  STRATEGIC LANDSCAPE:
                  {landscape}

                  Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
                as: questions
              - kind: agent
                profile: depo-answer-prep
                label: answer-prep
                task: |-
                  Prepare the witness for the predicted cross-examination below, one block per question,
                  in your required format. Follow your hard rules.
                  Witness: {params.witness}
                  Case facts: {params.case_facts}
                  Documents to quote from: search {params.knowledge_dir} with find/grep/read.

                  PREDICTED CROSS-EXAMINATION:
                  {questions}

                  Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
                as: prep
              - kind: agent
                profile: jev-gate
                label: coaching-guard
                task: |-
                  Call jev_check exactly once with rubric "witness-coaching", run_id "{params.run_id}", and
                  inputs set to the complete PREP text below (as a single string). Submit JSON {decision, reason}.

                  PREP:
                  {prep}
                json:
                  type: object
                  required: [decision, reason]
                  properties:
                    decision: { type: string }
                    reason: { type: string }
                  additionalProperties: false
                as: guard
              - kind: switch
                label: prep-routing
                on: "{guard}"
                cases:
                  - when: { eq: [decision, pass] }
                    then:
                      kind: value
                      value: { status: included, prep: "{prep}", guard: "{guard.reason}" }
                  - when: { eq: [decision, review] }
                    then:
                      kind: sequence
                      steps:
                        - kind: agent
                          profile: attorney-gate
                          label: prep-review-gate
                          task: |-
                            Call the attorney_review tool exactly once with:
                            - run_id: "{params.run_id}"
                            - title: "Witness preparation flagged for review"
                            - summary: one line "The coaching guard flagged this preparation text ({guard.reason}). Approve to include it in the package, or request changes to omit it." followed by the complete PREP text below.
                            Then submit the tool's returned text (the DECISION and COMMENT lines) verbatim as your result.

                            PREP:
                            {prep}
                          as: attorney
                        - kind: value
                          value: { status: reviewed, prep: "{prep}", guard: "{guard.reason}", attorney: "{attorney}" }
                else:
                  kind: value
                  value: { status: omitted, prep: "", guard: "{guard.reason}" }
                as: prep_decision
              - kind: value
                value: { questions: "{questions}", prep: "{prep_decision}" }
      else:
        kind: sequence
        steps:
          - kind: agent
            profile: depo-question-generator
            label: question-generator
            task: |-
              Build the deposition question outline.
              Witness: {params.witness}
              Topics: {params.topics}

              STRATEGIC LANDSCAPE:
              {landscape}

              Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
            as: questions
          - kind: agent
            profile: depo-researcher
            label: researcher
            task: |-
              Research the deposition themes against the matter record.
              Knowledge folder to search with find/grep/read: {params.knowledge_dir}
              Case facts: {params.case_facts}

              STRATEGIC LANDSCAPE:
              {landscape}

              Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
      as: workstream

    - kind: agent
      profile: depo-prep-writer
      label: report
      task: |-
        Write the final deposition preparation package for {params.witness}.
        Mode: {params.mode}

        The first line must be exactly:
        # Deposition prep - [witness name]
        Then: ## Executive summary, ## Attorney review focus, ## Themes, ## Questions,
        ## Vulnerabilities, ## Exhibit plan, ## Limitations.
        In Predicted cross-exam mode the WORKSTREAM OUTPUT is an object with `questions` and `prep`. Title
        the questions section "## Predicted cross-examination". Then handle `prep` by its `status`:
        - included: add "## Answer preparation" reproducing prep.prep verbatim, and note under
          ## Limitations that it passed the witness-coaching guard.
        - reviewed: add "## Answer preparation" only if prep.attorney contains "DECISION: approved";
          otherwise omit it. Under ## Limitations record the guard reason and the attorney decision.
        - omitted: do not add any preparation section. Under ## Limitations say: "Answer preparation was
          generated and withheld: the witness-coaching guard found it would script or re-frame testimony
          (<guard reason>). A witness is prepared to testify truthfully by their own lawyer."
        Never write answers, framing, or coaching yourself, and never state what a document "really meant".

        Under ## Attorney review focus list unchecked tasks `- [ ] SEVERITY - issue; action`
        (HIGH/MEDIUM/LOW), covering every fact that must be verified against the record and every
        vulnerability to work with the witness. Prefer 4-8 items; lead with HIGH.

        STRATEGIC LANDSCAPE:
        {landscape}

        WORKSTREAM OUTPUT:
        {workstream}

        Final action: call the pi_agents_submit_result tool with your complete deliverable as `result`. Do not write the deliverable as a message.
      as: report
